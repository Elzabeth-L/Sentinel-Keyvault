apiVersion: v1
kind: ConfigMap
metadata:
  name: sentinel-runtime-config
  namespace: sentinel-app
data:
  SENTINEL_ENVIRONMENT: aks
  SENTINEL_LOG_LEVEL: INFO
  SENTINEL_ENTRA_AUDIENCE: REPLACE_ME_IDENTITY_APP_CLIENT_ID
  SENTINEL_ENTRA_AUTHORITY_HOST: https://login.microsoftonline.com
  SENTINEL_MICROSOFT_CLIENT_ID: REPLACE_ME_IDENTITY_APP_CLIENT_ID
  SENTINEL_MICROSOFT_REDIRECT_URI: http://REPLACE_ME_SENTINEL_PUBLIC_IP/auth/callback
  SENTINEL_FRONTEND_URL: http://REPLACE_ME_SENTINEL_PUBLIC_IP
  SENTINEL_SESSION_COOKIE_NAME: sentinel_session
  SENTINEL_SESSION_COOKIE_SECURE: "false"
  SENTINEL_SESSION_TTL_SECONDS: "28800"
  SENTINEL_ALLOWED_TENANTS: ""
  SENTINEL_CORS_ORIGINS: http://REPLACE_ME_SENTINEL_PUBLIC_IP
  SENTINEL_IDENTITY_SERVICE_URL: http://identity-service.sentinel-app.svc.cluster.local
  SENTINEL_AUDIT_SERVICE_URL: http://audit-service.sentinel-app.svc.cluster.local
  SENTINEL_RELATIONSHIP_SERVICE_URL: http://relationship-service.sentinel-app.svc.cluster.local
  AZURE_TENANT_ID: REPLACE_ME_PROVIDER_ENTRA_TENANT_ID
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sentinel-runtime-config
  namespace: sentinel-workers
data:
  SENTINEL_ENVIRONMENT: aks
  SENTINEL_LOG_LEVEL: INFO
  SENTINEL_ENTRA_AUDIENCE: REPLACE_ME_IDENTITY_APP_CLIENT_ID
  SENTINEL_ENTRA_AUTHORITY_HOST: https://login.microsoftonline.com
  SENTINEL_IDENTITY_SERVICE_URL: http://identity-service.sentinel-app.svc.cluster.local
  SENTINEL_AUDIT_SERVICE_URL: http://audit-service.sentinel-app.svc.cluster.local
  SENTINEL_RELATIONSHIP_SERVICE_URL: http://relationship-service.sentinel-app.svc.cluster.local
  AZURE_TENANT_ID: REPLACE_ME_PROVIDER_ENTRA_TENANT_ID
